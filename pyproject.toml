[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physioload-ai"
version = "0.1.0"
description = "Reliability-aware static biomechanics from a single RGB image"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Berk Can Sefer"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
pose = ["opencv-python==4.11.0.86", "opencv-contrib-python==4.11.0.86", "mediapipe==0.10.21", "rtmlib>=0.0.13,<1", "onnxruntime>=1.18,<2"]
train = ["torch>=2.2,<3", "torchvision>=0.17,<1", "joblib>=1.3,<2"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[tool.setuptools]
packages = ["physioload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

