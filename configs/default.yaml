project:
  name: PhysioLoad AI
  seed: 42
  processed_version: v1

data:
  datasets: [fit3d, human36m]
  static_pose_min_count: 3
  split_unit: subject
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15

pose:
  backends: [mediapipe, rtmpose]
  common_schema: physioload_17
  image_color_space: RGB

biomechanics:
  gravity_m_s2: 9.80665
  allow_metric_outputs_without_scale: false
  allow_external_moment_without_load_definition: false

quality_gate:
  # Bunlar yalnız başlangıç yapılandırmasıdır; validasyonla kalibre edilmelidir.
  minimum_visibility: 0.70
  minimum_pose_confidence: 0.70
  maximum_view_deviation_deg: 20.0
  maximum_geometry_penalty: 0.35
  maximum_sensitivity_penalty: 0.50
  acceptance_threshold: 0.65

sensitivity:
  # Deneysel başlangıç değerleri; veri çözünürlüğü ve validasyonla gerekçelendirilir.
  perturbation_samples: 1000
  impact_quantile: 0.95

physical_validity:
  metric_outputs_require_scale: true
  external_moment_requires_complete_load: true

